version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: poshak
    ports:
      - "5432:5432"
    volumes:
      - poshak_pgdata:/var/lib/postgresql/data

volumes:
  poshak_pgdata:
